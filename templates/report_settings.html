{% extends "base.html" %}{% block content %}<div class="page-title"><div><h1>🖨️ Report Header & Footer</h1><p>Configure the project hard-copy report identity.</p></div><a class="btn" href="{{url_for('project',pid=pid)}}">← Project</a></div><div class="form-card"><form method="post"><div class="row"><div><label>Logo / Company Text</label><input name="logo_text" value="{{s.logo_text if s else 'Birhanu Abebe General Contractor'}}"></div><div><label>Contractor Role</label><select name="contractor_role"><option {{'selected' if s and s.contractor_role=='Main Contractor'}}>Main Contractor</option><option {{'selected' if s and s.contractor_role=='Subcontractor'}}>Subcontractor</option><option {{'selected' if s and s.contractor_role=='JV Contractor'}}>JV Contractor</option></select></div></div><div class="row"><div><label>Phone</label><input name="phone" value="{{s.phone if s else ''}}"></div><div><label>Fax</label><input name="fax" value="{{s.fax if s else ''}}"></div><div><label>Email</label><input name="email" value="{{s.email if s else ''}}"></div><div><label>Website</label><input name="website" value="{{s.website if s else ''}}"></div></div><label>Address</label><input name="address" value="{{s.address if s else ''}}"><button>💾 Save Report Identity</button></form></div>{% endblock %}
