{% extends "base.html" %}{% block content %}<div class="page-title"><div><h1>🏗️ Project Administration</h1><p>Super Admin creates projects and controls access.</p></div></div><div class="form-card"><form method="post"><div class="row"><div><label>Project Name</label><input name="name" required></div><div><label>Code</label><input name="code" required></div><div><label>Location</label><input name="location"></div></div><div class="row"><div><label>Client</label><input name="client"></div><div><label>Consultant</label><input name="consultant"></div><div><label>Status</label><select name="status"><option>Active</option><option>Planning</option><option>Completed</option><option>Handed Over</option></select></div></div><button>➕ Create Project</button></form></div><div class="table-card"><table><tr><th>Project</th><th>Code</th><th>Location</th><th>Status</th><th>BOQ</th></tr>{% for p in projects %}<tr><td>{{p.name}}</td><td>{{p.code}}</td><td>{{p.location}}</td><td>{{p.status}}</td><td><a class="btn small" href="{{url_for('boq_admin',pid=p.id)}}">📑 Manage BOQ</a></td></tr>{% endfor %}</table></div>{% endblock %}
