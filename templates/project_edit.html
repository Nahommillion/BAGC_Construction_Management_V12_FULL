{% extends "base.html" %}{% block content %}<div class="page-title"><div><h1>✏️ Edit Project Baseline</h1><p>Contract dates, duration, value, planned income and planned physical progress.</p></div><a class="btn" href="{{url_for('project',pid=p.id)}}">← Project</a></div><div class="form-card"><form method="post"><div class="row"><div><label>Project Name</label><input name="name" value="{{p.name}}" required></div><div><label>Code</label><input name="code" value="{{p.code}}" required></div><div><label>Location</label><input name="location" value="{{p.location}}"></div><div><label>Client</label><input name="client" value="{{p.client}}"></div></div><div class="row"><div><label>Consultant</label><input name="consultant" value="{{p.consultant}}"></div><div><label>Contractor Role</label><select name="contractor_role"><option {{'selected' if p.contractor_role=='Main Contractor'}}>Main Contractor</option><option {{'selected' if p.contractor_role=='Subcontractor'}}>Subcontractor</option><option {{'selected' if p.contractor_role=='JV Contractor'}}>JV Contractor</option></select></div><div><label>Status</label><select name="status">{% for x in ['Planning','Active','Completed','Handed Over'] %}<option {{'selected' if p.status==x}}>{{x}}</option>{% endfor %}</select></div><div><label>Contract Value ETB</label><input name="contract_value" type="number" step="0.01" value="{{p.contract_value or 0}}"></div></div><div class="row"><div><label>Contract Signed</label><input name="contract_sign_date" type="date" value="{{p.contract_sign_date or ''}}"></div><div><label>Commencement</label><input name="commencement_date" type="date" value="{{p.commencement_date or p.start_date or ''}}"></div><div><label>Contract End</label><input name="contract_end_date" type="date" value="{{p.contract_end_date or p.end_date or ''}}"></div><div><label>Contract Days</label><input name="contract_days" type="number" value="{{p.contract_days or 0}}"></div></div><div class="row"><div><label>Planned Income ETB</label><input name="planned_income" type="number" step="0.01" value="{{p.planned_income or 0}}"></div><div><label>Planned Physical %</label><input name="planned_physical_pct" type="number" step="0.01" value="{{p.planned_physical_pct or 0}}"></div><div><label>Legacy Start Date</label><input name="start_date" type="date" value="{{p.start_date or ''}}"></div><div><label>Legacy End Date</label><input name="end_date" type="date" value="{{p.end_date or ''}}"></div></div><button>💾 Save Project Baseline</button></form></div>{% endblock %}
